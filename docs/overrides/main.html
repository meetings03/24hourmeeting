        "mainEntity": [
          {
            "@type": "Question",
            "name": "Who is allowed to attend this online AA meeting?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We are an open meeting of Alcoholics Anonymous. Anyone with a desire to stop drinking is welcome to participate, regardless of background, status, or location."

            "@type": "Question",
            "name": "Is the meeting really available 24 hours a day?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The meeting runs continuously, and a new meeting starts at the top of each hour, every day."
            }
          },

            "@type": "Question",
            "name": "How do I join the 24-hour online AA meeting?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use Zoom Meeting ID 292 371 2604, or click the Join Meeting button at the top of this page."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a password to join?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. There is no password required for this Zoom meeting."
            }
          },
          {
            "@type": "Question",
            "name": "How do I speak or share during the online AA meeting?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "To share your experience, strength, and hope, simply raise your virtual hand. The chairperson calls on hands in the exact order they are raised."
            }
          },
          {
            "@type": "Question",
            "name": "Can I just listen, or do I have to speak?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You are completely welcome to just listen."
            }
          },
          {
            "@type": "Question",
            "name": "Can I get a sponsor on the online AA meeting?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The best way to get help in our meeting is to raise your virtual hand and let us know you are looking for a sponsor. We suggest that men work with men and women work with women."
            }
          },
          {
            "@type": "Question",
            "name": "Can I have my attendance verified for court or probation?",
            "acceptedAnswer": {
              "@type": "Answer",
