site_name: 24/7 Online A.A. Meeting | Join Live on Zoom
site_description: Join a 24/7 Online A.A. Meeting on Zoom. Open international Alcoholics Anonymous meeting every hour. Zoom ID 292 371 2604. No password required.
site_author: Help 24/7
site_url: https://sobrietyneversleeps.org/

extra:
  social:
    - icon: fontawesome/solid/paper-plane
      link: https://sobrietyneversleeps.org

nav:
  - Home: index.md
  - New to A.A.? Start Here: new-to-aa-start-here.md
  - Do You Have a Drinking Problem?: drinking-problem.md
  - Quick Answers: quick-answers.md
  - What to Expect When You Join: what-to-expect-when-you-join.md
  - FAQ: faq.md
  - Disclaimer and Permissions: disclaimer-and-permissions.md
  - A.A. Literature: aa-literature.md
  - International A.A. Websites: international-aa-websites.md
  - Crisis and Mental Health Resources: crisis-resources.md
  - Recovery Resources: recovery-resources.md
  - Topics for Online A.A. Meetings: topics-for-online-aa-meetings.md
  - A.A.'s Primary Purpose: aa-primary-purpose.md
  - A.A.'s Three Legacies: aas-three-legacies.md
  - Problems Other Than Alcohol: problems-other-than-alcohol.md
  - A.A. Grapevine and La Vi&ntilde;a: aa-grapevine-and-la-vina.md
  - Sponsorship: sponsorship.md
  - About This Meeting: about-this-meeting.md
  - Contact This 24/7 Online A.A. Meeting: contact-this-24-7-online-aa-meeting.md

plugins:
  - search

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - scheme: default
      primary: indigo
      accent: blue
  features:
    - navigation.instant
    - content.code.copy
    - navigation.sections

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - attr_list
